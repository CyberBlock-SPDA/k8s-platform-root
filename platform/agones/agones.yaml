apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: agones, namespace: flux-system}
spec: {interval: 1h, url: https://agones.dev/chart/stable}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agones
  namespace: flux-system
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: agones-system
  storageNamespace: agones-system
  install: {createNamespace: true, crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  chart:
    spec: {chart: agones, version: "1.62.0", sourceRef: {kind: HelmRepository, name: agones}}
  values:
    gameservers:
      namespaces: [team-1]
      minPort: 7000
      maxPort: 8000
    agones:
      ping: {install: false}
      allocator: {install: false}
      controller: {replicas: 1}
      extensions: {replicas: 1}
