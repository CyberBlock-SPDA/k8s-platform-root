apiVersion: v1
kind: Namespace
metadata:
  name: team-1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-1-deployer
  namespace: team-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-1-deployer-admin-binding
  namespace: team-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: team-1-deployer
  namespace: team-1
