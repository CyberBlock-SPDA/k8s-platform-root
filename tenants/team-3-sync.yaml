#TODO: replace xxx strings
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: xxx-apps-infrastructure, namespace: team-3}
spec:
  interval: 5m
  url: ssh://git@github.com/xxx
  ref: {branch: main}
  secretRef: {name: apps-infra-read}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: apps-infra, namespace: team-3}
spec:
  interval: 10m
  path: .xxx/deploy/prod # root of teams infrastructure
  prune: true
  wait: true
  serviceAccountName: team-3-deployer
  sourceRef: {kind: GitRepository, name: xxx-apps-infrastructure}
