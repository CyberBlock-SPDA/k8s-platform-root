apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ext-app-workloads
  namespace: team-1
  labels:
    app.kubernetes.io/part-of: platform-root
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames:
      - backend-agones-allocator
      - alloy-log-reader
    verbs: ["bind", "escalate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ext-app-workloads
  namespace: team-1
  labels:
    app.kubernetes.io/part-of: platform-root
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-ext-app-workloads
subjects:
  - kind: ServiceAccount
    name: team-1-deployer
    namespace: team-1
