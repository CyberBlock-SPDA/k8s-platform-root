apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: SPDA_PUT, namespace: team-2}
spec:
  interval: 5m
  url: ssh://git@github.com/am1rkzn/SPDA_PUT
  ref: {branch: main}
  secretRef: {name: team-2-infra-read}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: team-2-infra, namespace: team-2}
spec:
  interval: 10m
  path: ./ # root of teams infrastructure
  prune: true
  wait: true
  serviceAccountName: team-2-deployer
  sourceRef: {kind: GitRepository, name: SPDA_PUT}
