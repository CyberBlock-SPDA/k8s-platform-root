apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- tenants.yaml
- platform.yaml
patches:
- path: helm-controller-no-cross-namespace-refs.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: helm-controller
    namespace: flux-system
