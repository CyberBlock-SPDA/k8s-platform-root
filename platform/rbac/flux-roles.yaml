apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ext-flux
  namespace: team-1
  labels: {app.kubernetes.io/part-of: platform-root}
rules:
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources: ["gitrepositories", "ocirepositories", "helmrepositories", "buckets", "externalartifacts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources: ["kustomizations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ext-flux-image
  namespace: team-1
  labels: {app.kubernetes.io/part-of: platform-root}
rules:
- apiGroups: ["image.toolkit.fluxcd.io"]
  resources: ["imagerepositories", "imagepolicies", "imageupdateautomations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: platform-ext-flux, namespace: team-1}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ext-flux}
subjects: [{kind: ServiceAccount, name: team-1-deployer, namespace: team-1}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: platform-ext-flux-image, namespace: team-1}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ext-flux-image}
subjects: [{kind: ServiceAccount, name: team-1-deployer, namespace: team-1}]
