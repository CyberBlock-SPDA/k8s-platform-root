apiVersion: v1
kind: Namespace
metadata:
  name: team-1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-1-deployer
  namespace: team-1

---
# =====================================================================
# КОНТУР TEAM-2 (ПЕСОЧНИЦА ВТОРОЙ КОМАНДЫ)
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: team-2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-2-deployer
  namespace: team-2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-2-deployer-admin-binding
  namespace: team-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: team-2-deployer
  namespace: team-2

---
# =====================================================================
# КОНТУР TEAM-3 (ПЕСОЧНИЦА ТРЕТЬЕЙ КОМАНДЫ)
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: team-3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-3-deployer
  namespace: team-3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-3-deployer-admin-binding
  namespace: team-3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: team-3-deployer
  namespace: team-3
