---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-metrics-read
  namespace: team-1
  labels: {app.kubernetes.io/part-of: platform-root}
rules:
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: platform-metrics-read, namespace: team-1}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-metrics-read}
subjects: [{kind: ServiceAccount, name: team-1-deployer, namespace: team-1}]
